[package]
name = "compute-shader-toy"
version = "0.1.0"
authors = ["Raph Levien <raph@google.com>"]
license = "MIT/Apache-2.0"
description = "A simple compute shader example that draws in a window, based on wgpu."
edition = "2021"

[dependencies]
wgpu = { version = "0.18" }
winit = "0.28"
pollster = "0.3"
async-executor = "1.8"
bytemuck = { version = "1.14", features = ["derive"] }

# TODO: we can reference github for this
flatten = { path = "../../gpu-stroke-expansion-paper/flatten" }
kurbo = "0.11"

# for pico_svg
roxmltree = "0.20.0"
peniko = "0.2.0"
